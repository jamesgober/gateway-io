name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.89"]
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (gateway-io alone)
        run: cargo clippy --locked -p gateway-io --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Doc
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit

  musl:
    name: Static Linux build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl C toolchain (for aws-lc-sys)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p wasp
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Statically linked
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/wasp
          file "$BIN"
          file "$BIN" | grep -E "static(ally|-pie) linked"
      - uses: actions/upload-artifact@v4
        with:
          name: wasp-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/wasp
