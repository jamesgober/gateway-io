name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.89"]
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (gateway-io alone)
        run: cargo clippy --locked -p gateway-io --all-targets -- -D warnings
      - name: Clippy (wasp on nex-db only)
        run: cargo clippy --locked -p wasp --all-targets --no-default-features --features store-nex -- -D warnings
      - name: Clippy (wasp with no store features)
        run: cargo clippy --locked -p wasp --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Test (wasp on nex-db only)
        run: cargo test --locked -p wasp --no-default-features --features store-nex
      - name: Doc
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit

  musl:
    name: Static Linux build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build (nex-db only, no C toolchain)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p wasp --no-default-features --features store-nex
      - name: Statically linked
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/wasp
          file "$BIN"
          file "$BIN" | grep -E "static(ally|-pie) linked"
      - name: Bundle (binary, theme, start shim, deploy notes, example configuration)
        run: deploy/bundle.sh target/x86_64-unknown-linux-musl/release/wasp "$(git rev-parse --short=7 HEAD)" dist
      - name: The bundle's checksum and contents
        run: |
          cd dist
          sha256sum -c ./*.sha256
          tar -tzf ./*.tar.gz | sort
      - uses: actions/upload-artifact@v4
        with:
          name: wasp-bundle-x86_64-linux-musl
          path: dist/
