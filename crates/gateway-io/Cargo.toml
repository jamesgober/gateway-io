[package]
name = "gateway-io"
description = "The platform's front door: listeners, the bouncer door, the parser, the passport pipeline, and the response."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
wasp-core = { path = "../wasp-core" }
# Listeners, the connection engine, HTTP/1.1 through http-net, drain.
serve-net = { workspace = true }
# WebSocket limits and origin policy (serve-net's `ws` drives the protocol).
ws-net = { workspace = true }
# The transport under serve-net (gate, control line, ids).
net-io = { workspace = true }
# The door before any byte is read, request tickets, egress on every write.
bouncer-io = { workspace = true }
# The web service: site, url, router, authorize, handlers, render (public, generic).
web-net = { workspace = true }
# The gates (feature `gatekeeper`): authentication in the core, authorization
# in web-net, sign-in and sign-out, CSRF.
gatekeeper-io = { workspace = true, optional = true }
# TLS termination (feature `tls`, G-90): rustls on net-io's TLS seam.
tls-net = { workspace = true, optional = true }

[features]
default = []
gatekeeper = ["dep:gatekeeper-io"]
# TLS termination (`[tls]`): brings ring, which needs a C compiler.
tls = ["dep:tls-net"]

[dev-dependencies]
bouncer-io = { workspace = true }
# A WebSocket client for the tests.
ws-net = { workspace = true, features = ["std"] }
# The HPACK decoder of the tests' small HTTP/2 client.
h2-net = { version = "0.3.1", default-features = false }
# A TLS client for the tests (feature `tls`).
tls-net = { workspace = true }

[[bench]]
name = "request_path"
harness = false

[lints]
workspace = true
