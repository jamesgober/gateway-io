{% extends "base" %}
{% block content %}
<article>
<h1>{{ page.title }}</h1>
{% if page.security.error %}<p class="error" role="alert">{{ page.security.error }}</p>{% endif %}
<form class="stack" method="post" action="{{ page.security.action }}">
<input type="hidden" name="csrf_token" value="{{ page.security.csrf }}">
<label>Code from your authenticator app, or a recovery code <input name="code" autocomplete="one-time-code" autofocus required></label>
{% if page.security.remember_days %}<label class="check"><input type="checkbox" name="remember" value="on"> Don't ask on this device for {{ page.security.remember_days }} days</label>{% endif %}
<button type="submit">Sign in</button>
</form>
</article>
{% endblock %}
