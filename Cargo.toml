[workspace]
resolver = "3"
members = ["crates/wasp-core", "crates/gateway-io", "crates/wasp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-Proprietary"
authors = ["James Gober <me@jamesgober.com>"]
publish = false

# Published first-party crates only; nothing here is a path into another repository.
# net-io 0.7: serve-net 0.8, bouncer-io 0.11 and web-net 0.10.1 are built on it, and the
# gate and control-line types cross between them, so one net-io version must be in the tree.
[workspace.dependencies]
serve-net = { version = "0.8.1", default-features = false, features = ["http1"] }
net-io = "0.7.2"
http-net = { version = "0.9.2", default-features = false }
bouncer-io = { version = "0.11", features = ["net-io"] }
system-suite = { version = "0.8", default-features = false, features = ["kernel", "signals", "config", "log"] }
web-net = { version = "0.10.1", default-features = false }
luminess = { version = "0.10", features = ["web-net"] }
bison-db = { version = "1.1", default-features = false, features = ["std"] }
gatekeeper-io = "0.6"
# nex-db is not on crates.io: its git tag, never a path.
nex-db = { git = "https://github.com/jamesgober/nex-db", tag = "v0.8.1" }
key-vault = { version = "1.1", features = ["fetcher-file"] }
crypt-io = "1.6"
id-forge = { version = "1.0", default-features = false, features = ["ulid"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing (Argon2id) at full speed in debug and test builds: a
# sign-in in a test takes a tenth of a second, not seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"
