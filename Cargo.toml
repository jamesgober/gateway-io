[workspace]
resolver = "3"
members = ["crates/wasp-core", "crates/gateway-io", "crates/wasp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-Proprietary"
authors = ["James Gober <me@jamesgober.com>"]
publish = false

# Published first-party crates only; nothing here is a path into another repository.
# net-io 0.7: serve-net 0.9, bouncer-io and web-net 0.11 are built on it, and the
# gate and control-line types cross between them, so one net-io version must be in the tree.
[workspace.dependencies]
serve-net = { version = "0.9", default-features = false, features = ["http1", "h2", "ws"] }
# The WebSocket protocol under serve-net's `ws` feature: its limits and origin policy.
ws-net = { version = "0.9", default-features = false }
net-io = "0.7.3"
bouncer-io = { version = "0.12", features = ["net-io"] }
system-suite = { version = "0.9.5", default-features = false, features = ["kernel", "sys", "signals", "config", "log"] }
web-net = { version = "0.11", default-features = false }
luminess = { version = "0.10.1", features = ["web-net"] }
bison-db = { version = "1.1", default-features = false, features = ["std"] }
gatekeeper-io = "0.7"
# nex-db is not on crates.io: its git tag, never a path.
nex-db = { git = "https://github.com/jamesgober/nex-db", tag = "v0.9.0" }
key-vault = { version = "1.1", features = ["fetcher-file"] }
# TLS termination (G-90): rustls, with ring as its provider.
tls-net = { version = "0.11", default-features = false, features = ["ring", "net-io"] }
crypt-io = "1.7"
id-forge = { version = "1.0", default-features = false, features = ["ulid"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing (Argon2id) at full speed in debug and test builds: a
# sign-in in a test takes a tenth of a second, not seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"
